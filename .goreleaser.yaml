# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

builds:
  - id: "kubesnap"
    main: ./cmd/
    binary: ks
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/hunsy9/kubesnap/pkg/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).

scoops:
  - repository:
      owner: hunsy9
      name: scoop-bucket
      token: "{{ .Env.GITHUB_TOKEN }}"
    homepage: "https://github.com/hunsy9/kubesnap"
    description: "Improved kubernetes context management tool"
    license: "MIT"

brews:
  - repository:
      owner: hunsy9
      name: homebrew-kubesnap

      token: "{{.Env.GITHUB_TOKEN}}"
    name: kubesnap
    url_template: "https://github.com/hunsy9/kubesnap/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/hunsy9/homebrew-kubesnap"
    description: "Improved kubernetes context management tool"
    license: "MIT"
    install: |
      bin.install "ks"
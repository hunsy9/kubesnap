apiVersion: v1
kind: Config
current-context: dev-cluster
clusters:
- name: dev-cluster
  cluster:
    server: https://dev.example.com:6443
    certificate-authority-data: ZGV2LWNhLWRhdGE=
- name: staging-cluster
  cluster:
    server: https://staging.example.com:6443
    certificate-authority-data: c3RhZ2luZy1jYS1kYXRh
- name: prod-cluster
  cluster:
    server: https://prod.example.com:6443
    certificate-authority-data: cHJvZC1jYS1kYXRh
contexts:
- name: dev-cluster
  context:
    cluster: dev-cluster
    user: dev-user
    namespace: default
- name: staging-cluster
  context:
    cluster: staging-cluster
    user: staging-user
    namespace: staging-ns
- name: prod-cluster
  context:
    cluster: prod-cluster
    user: prod-user
    namespace: production
users:
- name: dev-user
  user:
    token: dev-token
- name: staging-user
  user:
    token: staging-token
- name: prod-user
  user:
    token: prod-token
